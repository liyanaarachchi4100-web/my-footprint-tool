<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AS OrderFlow</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b0f14;
  color:#e8edf3;
  font-family:Arial,sans-serif;
}

.header{
  height:58px;
  background:#111820;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  border-bottom:1px solid #29323c;
}

.logo{
  font-size:20px;
  font-weight:bold;
  color:#42d392;
}

.controls{
  display:flex;
  gap:8px;
}

select,button{
  background:#18212b;
  color:white;
  border:1px solid #35414d;
  border-radius:5px;
  padding:8px 12px;
}

.main{
  padding:10px;
}

.chart{
  height:430px;
  background:#10161d;
  border:1px solid #29323c;
  border-radius:7px;
  overflow:hidden;
}

.title{
  padding:10px;
  color:#9da9b5;
  font-weight:bold;
}

.status{
  padding:0 10px 10px;
  font-size:13px;
  color:#42d392;
}

#chart{
  width:100%;
  height:350px;
}

.info{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

.box{
  background:#111820;
  border:1px solid #29323c;
  border-radius:7px;
  padding:14px;
}

.label{
  color:#8793a0;
  font-size:12px;
}

.value{
  font-size:18px;
  margin-top:6px;
  font-weight:bold;
}

.green{
  color:#21c784;
}

.red{
  color:#e05260;
}

.footprint{
  margin-top:10px;
  background:#10161d;
  border:1px solid #29323c;
  border-radius:7px;
  padding:12px;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  text-align:center;
}

th{
  color:#7f8b98;
  font-size:12px;
  padding:8px;
}

td{
  padding:8px;
  border-top:1px solid #202932;
}

@media(max-width:600px){
  .info{
    grid-template-columns:repeat(2,1fr);
  }

  .chart{
    height:360px;
  }

  #chart{
    height:280px;
  }
}
</style>
</head>

<body>

<div class="header">

  <div class="logo">
    AS ORDERFLOW
  </div>

  <div class="controls">

    <select id="symbol">
      <option value="XAUUSD">XAUUSD</option>
    </select>

    <select id="timeframe">
      <option value="1">1m</option>
      <option value="5">5m</option>
      <option value="15">15m</option>
      <option value="60">1H</option>
    </select>

  </div>

</div>

<div class="main">

  <div class="chart">

    <div class="title">
      XAUUSD · ORDER FLOW
    </div>

    <div class="status" id="status">
      Waiting for market data...
    </div>

    <div id="chart"></div>

  </div>


  <div class="info">

    <div class="box">
      <div class="label">PRICE</div>
      <div class="value" id="price">--</div>
    </div>

    <div class="box">
      <div class="label">DELTA</div>
      <div class="value" id="delta">--</div>
    </div>

    <div class="box">
      <div class="label">CVD</div>
      <div class="value" id="cvd">--</div>
    </div>

    <div class="box">
      <div class="label">VWAP</div>
      <div class="value" id="vwap">--</div>
    </div>

  </div>


  <div class="footprint">

    <h3>FOOTPRINT</h3>

    <table>

      <thead>
        <tr>
          <th>PRICE</th>
          <th>BUY</th>
          <th>SELL</th>
          <th>DELTA</th>
        </tr>
      </thead>

      <tbody id="footprintBody">

        <tr>
          <td colspan="4">
            Waiting for real market data...
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>

<script>
const statusEl = document.getElementById("status");
const priceEl = document.getElementById("price");

function setStatus(message){
  statusEl.textContent = message;
}

async function loadMarket(){
  try{
    setStatus("Connecting to market data...");

    const response = await fetch("/api/market");
    const data = await response.json();

    if(data.price !== null){
      priceEl.textContent = data.price;
      setStatus("Live market data connected");
    }else{
      priceEl.textContent = "--";
      setStatus("Waiting for live market feed...");
    }

  }catch(error){
    console.error(error);
    setStatus("Market data connection error");
  }
}

loadMarket();

setInterval(loadMarket, 3000);

</script>

</body>
</html>
