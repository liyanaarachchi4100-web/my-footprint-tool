<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AS OrderFlow</title>

  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0b0f14;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-top: 0;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    select {
      background: #151b23;
      color: white;
      border: 1px solid #333;
      padding: 10px;
      border-radius: 6px;
    }

    .status {
      margin-bottom: 15px;
      color: #55d98b;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .card {
      background: #151b23;
      border: 1px solid #252d38;
      border-radius: 8px;
      padding: 15px;
    }

    .label {
      color: #8b96a5;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .value {
      font-size: 22px;
      font-weight: bold;
    }

    #chart {
      width: 100%;
      height: 450px;
      background: #11161d;
      border: 1px solid #252d38;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .footprint {
      background: #151b23;
      border: 1px solid #252d38;
      border-radius: 8px;
      padding: 15px;
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      #chart {
        height: 380px;
      }
    }
  </style>
</head>

<body>

  <h1>AS OrderFlow</h1>

  <div class="controls">

    <select id="symbol">
      <option value="XAU/USD">XAUUSD</option>
    </select>

    <select id="timeframe">
      <option value="1min">1 Minute</option>
      <option value="5min">5 Minutes</option>
      <option value="15min">15 Minutes</option>
      <option value="1h">1 Hour</option>
    </select>

  </div>

  <div class="status" id="status">
    Connecting to live market data...
  </div>

  <div class="cards">

    <div class="card">
      <div class="label">PRICE</div>
      <div class="value" id="price">--</div>
    </div>

    <div class="card">
      <div class="label">DELTA</div>
      <div class="value" id="delta">--</div>
    </div>

    <div class="card">
      <div class="label">CVD</div>
      <div class="value" id="cvd">--</div>
    </div>

    <div class="card">
      <div class="label">VWAP</div>
      <div class="value" id="vwap">--</div>
    </div>

  </div>

  <div id="chart"></div>

  <div class="footprint">

    <h3>Footprint</h3>

    <p id="footprintStatus">
      Waiting for real market data...
    </p>

  </div>


<script>

let lastPrice = null;
let chart;
let candleSeries;


/* =========================
   CREATE CHART
========================= */

function createChart() {

  const container = document.getElementById("chart");

  chart = LightweightCharts.createChart(container, {

    layout: {
      background: {
        color: "#11161d"
      },
      textColor: "#b8c0cc"
    },

    grid: {
      vertLines: {
        color: "#202731"
      },
      horzLines: {
        color: "#202731"
      }
    },

    rightPriceScale: {
      borderColor: "#303844"
    },

    timeScale: {
      borderColor: "#303844",
      timeVisible: true,
      secondsVisible: false
    },

    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal
    }

  });


  candleSeries = chart.addCandlestickSeries({

    upColor: "#26a69a",
    downColor: "#ef5350",

    borderUpColor: "#26a69a",
    borderDownColor: "#ef5350",

    wickUpColor: "#26a69a",
    wickDownColor: "#ef5350"

  });


  window.addEventListener("resize", function() {

    chart.applyOptions({
      width: container.clientWidth
    });

  });

}


/* =========================
   LOAD CANDLES
========================= */

async function loadCandles() {

  const interval =
    document.getElementById("timeframe").value;

  try {

    const response = await fetch(
      "/api/market?interval=" +
      encodeURIComponent(interval) +
      "&t=" +
      Date.now(),
      {
        cache: "no-store"
      }
    );

    const data = await response.json();

    if (
      !response.ok ||
      data.status !== "live" ||
      !Array.isArray(data.values)
    ) {

      console.log("Candle data unavailable:", data);

      return;

    }


    const candles = data.values
      .map(function(item) {

        return {

          time: Math.floor(
            new Date(item.datetime).getTime() / 1000
          ),

          open: Number(item.open),
          high: Number(item.high),
          low: Number(item.low),
          close: Number(item.close)

        };

      })
      .filter(function(candle) {

        return Number.isFinite(candle.open) &&
               Number.isFinite(candle.high) &&
               Number.isFinite(candle.low) &&
               Number.isFinite(candle.close);

      })
      .sort(function(a, b) {

        return a.time - b.time;

      });


    if (candles.length > 0) {

      candleSeries.setData(candles);

      chart.timeScale().fitContent();

      const latest =
        candles[candles.length - 1].close;

      lastPrice = latest;

      document.getElementById("price").textContent =
        latest.toFixed(2);

      document.getElementById("status").textContent =
        "● Live XAU/USD market data";

      document.getElementById("footprintStatus").textContent =
        "Real XAU/USD candle data connected. Footprint data pending.";

    }

  } catch (error) {

    console.log("Candle request failed:", error);

    if (lastPrice !== null) {

      document.getElementById("price").textContent =
        lastPrice.toFixed(2);

    }

  }

}


/* =========================
   TIMEFRAME CHANGE
========================= */

document
  .getElementById("timeframe")
  .addEventListener("change", function() {

    loadCandles();

  });


/* =========================
   START
========================= */

createChart();

loadCandles();


/*
   Refresh candles every 10 seconds
*/

setInterval(loadCandles, 10000);

</script>

</body>
</html>
