<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AS OrderFlow</title>

  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0b0f14;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-top: 0;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    select {
      background: #151b23;
      color: white;
      border: 1px solid #333;
      padding: 10px;
      border-radius: 6px;
    }

    .status {
      margin-bottom: 15px;
      color: #55d98b;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .card {
      background: #151b23;
      border: 1px solid #252d38;
      border-radius: 8px;
      padding: 15px;
    }

    .label {
      color: #8b96a5;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .value {
      font-size: 22px;
      font-weight: bold;
    }

    #chart {
      width: 100%;
      height: 450px;
      background: #11161d;
      border: 1px solid #252d38;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .footprint {
      background: #151b23;
      border: 1px solid #252d38;
      border-radius: 8px;
      padding: 15px;
    }

    .info {
      color: #9aa4b2;
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      #chart {
        height: 380px;
      }
    }
  </style>
</head>

<body>

  <h1>AS OrderFlow</h1>

  <div class="controls">

    <select id="symbol">
      <option value="XAU/USD">XAUUSD</option>
    </select>

    <select id="timeframe">
      <option value="1min">1 Minute</option>
      <option value="5min">5 Minutes</option>
      <option value="15min">15 Minutes</option>
      <option value="1h">1 Hour</option>
    </select>

  </div>

  <div class="status" id="status">
    Connecting to live market data...
  </div>

  <div class="cards">

    <div class="card">
      <div class="label">PRICE</div>
      <div class="value" id="price">--</div>
    </div>

    <div class="card">
      <div class="label">VOLUME</div>
      <div class="value" id="volume">--</div>
    </div>

    <div class="card">
      <div class="label">DELTA</div>
      <div class="value" id="delta">--</div>
    </div>

    <div class="card">
      <div class="label">CVD</div>
      <div class="value" id="cvd">--</div>
    </div>

    <div class="card">
      <div class="label">VWAP</div>
      <div class="value" id="vwap">--</div>
    </div>

  </div>

  <div id="chart"></div>

  <div class="footprint">

    <h3>Footprint</h3>

    <p id="footprintStatus" class="info">
      Waiting for real market data...
    </p>

  </div>


<script>

let lastPrice = null;
let lastVWAP = null;
let lastVolume = null;

let chart = null;
let candleSeries = null;
let vwapSeries = null;


/* =========================
   CREATE CHART
========================= */

function createChart() {

  const container = document.getElementById("chart");

  chart = LightweightCharts.createChart(container, {

    width: container.clientWidth,
    height: container.clientHeight,

    layout: {
      background: {
        color: "#11161d"
      },
      textColor: "#b8c0cc"
    },

    grid: {
      vertLines: {
        color: "#202731"
      },
      horzLines: {
        color: "#202731"
      }
    },

    rightPriceScale: {
      borderColor: "#303844"
    },

    timeScale: {
      borderColor: "#303844",
      timeVisible: true,
      secondsVisible: false
    },

    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal
    }

  });


  candleSeries = chart.addCandlestickSeries({

    upColor: "#26a69a",
    downColor: "#ef5350",

    borderUpColor: "#26a69a",
    borderDownColor: "#ef5350",

    wickUpColor: "#26a69a",
    wickDownColor: "#ef5350"

  });


  vwapSeries = chart.addLineSeries({

    lineWidth: 2,

    priceLineVisible: false,

    lastValueVisible: true

  });


  window.addEventListener("resize", function() {

    chart.applyOptions({

      width: container.clientWidth,

      height: container.clientHeight

    });

  });

}


/* =========================
   LOAD MARKET DATA
========================= */

async function loadCandles() {

  const interval =
    document.getElementById("timeframe").value;

  try {

    const url =
      "/api/market?interval=" +
      encodeURIComponent(interval) +
      "&t=" +
      Date.now();

    const response = await fetch(url, {

      cache: "no-store"

    });


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data = await response.json();

    console.log("MARKET DATA:", data);


    if (
      !Array.isArray(data.values) ||
      data.values.length === 0
    ) {

      document.getElementById("status").textContent =
        "Waiting for market data...";

      return;

    }


    /* =========================
       CANDLES
    ========================= */

    const candles = data.values

      .map(function(item) {

        const timestamp =
          Math.floor(
            new Date(
              item.datetime.replace(" ", "T")
            ).getTime() / 1000
          );

        return {

          time: timestamp,

          open: Number(item.open),

          high: Number(item.high),

          low: Number(item.low),

          close: Number(item.close)

        };

      })

      .filter(function(candle) {

        return (

          Number.isFinite(candle.time) &&

          Number.isFinite(candle.open) &&

          Number.isFinite(candle.high) &&

          Number.isFinite(candle.low) &&

          Number.isFinite(candle.close)

        );

      })

      .sort(function(a, b) {

        return a.time - b.time;

      });


    if (candles.length === 0) {

      document.getElementById("status").textContent =
        "Waiting for valid candle data...";

      return;

    }


    /* =========================
       REMOVE DUPLICATES
    ========================= */

    const uniqueCandles = [];

    const usedTimes = new Set();

    candles.forEach(function(candle) {

      if (!usedTimes.has(candle.time)) {

        usedTimes.add(candle.time);

        uniqueCandles.push(candle);

      }

    });


    candleSeries.setData(
      uniqueCandles
    );


    /* =========================
       REAL VWAP
    ========================= */

    const vwapValues =
      Array.isArray(data.vwapValues)
        ? data.vwapValues
        : [];


    const vwapData = vwapValues

      .map(function(item) {

        const timestamp =
          Math.floor(
            new Date(
              item.datetime.replace(" ", "T")
            ).getTime() / 1000
          );

        return {

          time: timestamp,

          value: Number(item.vwap)

        };

      })

      .filter(function(item) {

        return (

          Number.isFinite(item.time) &&

          Number.isFinite(item.value)

        );

      })

      .sort(function(a, b) {

        return a.time - b.time;

      });


    const uniqueVWAP = [];

    const usedVWAPTimes = new Set();

    vwapData.forEach(function(item) {

      if (!usedVWAPTimes.has(item.time)) {

        usedVWAPTimes.add(item.time);

        uniqueVWAP.push(item);

      }

    });


    if (uniqueVWAP.length > 0) {

      vwapSeries.setData(
        uniqueVWAP
      );


      const latestVWAP =
        uniqueVWAP[
          uniqueVWAP.length - 1
        ].value;


      lastVWAP = latestVWAP;


      document.getElementById("vwap").textContent =
        latestVWAP.toFixed(2);

    }


    /* =========================
       LATEST PRICE
    ========================= */

    const latest =
      uniqueCandles[
        uniqueCandles.length - 1
      ].close;


    lastPrice = latest;


    document.getElementById("price").textContent =
      latest.toFixed(2);


    /* =========================
       VOLUME
    ========================= */

    const latestRaw =
      data.values[
        data.values.length - 1
      ];

    const rawVolume =
      latestRaw.volume;


    if (
      rawVolume !== undefined &&
      rawVolume !== null &&
      rawVolume !== ""
    ) {

      const numericVolume =
        Number(rawVolume);

      if (Number.isFinite(numericVolume)) {

        lastVolume = numericVolume;

        document.getElementById("volume").textContent =
          numericVolume.toLocaleString();

      } else {

        document.getElementById("volume").textContent =
          "--";

      }

    } else {

      document.getElementById("volume").textContent =
        "--";

    }


    /* =========================
       NO FAKE DELTA / CVD
    ========================= */

    document.getElementById("delta").textContent =
      "--";

    document.getElementById("cvd").textContent =
      "--";


    /* =========================
       STATUS
    ========================= */

    document.getElementById("status").textContent =
      "● Live XAU/USD market data";


    document.getElementById("footprintStatus").textContent =
      "Real XAU/USD OHLC + VWAP data connected. " +
      "Volume is shown only when supplied by the data feed. " +
      "Real Buy/Sell Delta and CVD are not calculated from volume.";


    /* =========================
       FIT CHART
    ========================= */

    chart.timeScale().fitContent();

  }


  catch (error) {

    console.log(
      "Market request failed:",
      error
    );


    if (lastPrice !== null) {

      document.getElementById("price").textContent =
        lastPrice.toFixed(2);

    }


    if (lastVWAP !== null) {

      document.getElementById("vwap").textContent =
        lastVWAP.toFixed(2);

    }


    if (lastVolume !== null) {

      document.getElementById("volume").textContent =
        lastVolume.toLocaleString();

    }


    document.getElementById("status").textContent =
      "● Using last received market data";

  }

}


/* =========================
   TIMEFRAME CHANGE
========================= */

document
  .getElementById("timeframe")
  .addEventListener(
    "change",
    function() {

      loadCandles();

    }
  );


/* =========================
   START
========================= */

createChart();

loadCandles();


/* =========================
   REFRESH
   EVERY 30 SECONDS
========================= */

setInterval(
  function() {

    loadCandles();

  },
  30000
);

</script>

</body>
</html>
